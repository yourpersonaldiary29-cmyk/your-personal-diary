<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4c7e"/>
      <stop offset="1" stop-color="#1b2f4f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f1ecdd"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <!-- book cover -->
  <rect x="212" y="176" width="600" height="672" rx="56" fill="#c9a86a"/>
  <rect x="252" y="176" width="560" height="672" rx="48" fill="url(#page)"/>
  <!-- spine -->
  <rect x="212" y="176" width="70" height="672" rx="30" fill="#a6864c"/>
  <!-- lines -->
  <g stroke="#b9b09a" stroke-width="18" stroke-linecap="round">
    <line x1="360" y1="330" x2="740" y2="330"/>
    <line x1="360" y1="420" x2="740" y2="420"/>
    <line x1="360" y1="510" x2="640" y2="510"/>
  </g>
  <!-- lock -->
  <circle cx="700" cy="720" r="150" fill="#2b4c7e"/>
  <path d="M640 700 v-50 a60 60 0 0 1 120 0 v50" fill="none" stroke="#fffdf6" stroke-width="26" stroke-linecap="round"/>
  <rect x="616" y="700" width="168" height="120" rx="24" fill="#fffdf6"/>
  <circle cx="700" cy="750" r="18" fill="#2b4c7e"/>
  <rect x="691" y="760" width="18" height="34" rx="6" fill="#2b4c7e"/>
</svg>
