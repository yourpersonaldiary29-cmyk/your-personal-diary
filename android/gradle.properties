# Project-wide Gradle settings of the Android project.
#
# The environment (JAVA_HOME, ANDROID_HOME, GRADLE_USER_HOME, local.properties) is set per process by
# scripts/android/env.ps1 - nothing here depends on a user profile.

# JVM arguments of the Gradle daemon (R8 of the release build needs the head-room).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure (required by Capacitor).
android.useAndroidX=true

# Never download SDK components from the build: missing platforms / build-tools are installed with the
# SDK's own tool on purpose (docs/ANDROID-PLAN.md section 6, scripts/android/doctor.ps1).
android.builder.sdkDownload=false

# Reuse task outputs across builds (cache under GRADLE_USER_HOME).
org.gradle.caching=true
