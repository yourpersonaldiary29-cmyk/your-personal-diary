/*
 * Your Personal Diary - the Android application module (Capacitor 8, docs/ANDROID-PLAN.md WP-14).
 *
 * Identity - ONE place:
 *   - applicationId: `appId` below, "app.yourpersonaldiary" (owner decision 2026-10-25,
 *     docs/android-tasks/ANDROID-APP-ID.md). It is the app's identity on the phone and on Google Play
 *     (the package name Play shows, the process name, ${applicationId} in the manifest - the
 *     FileProvider authorities) and it can NEVER change after the first Play upload.
 *     "com.mydiary.app" is taken on Play by another developer's app; "app.yourpersonaldiary" matches
 *     the planned domain yourpersonaldiary.app. capacitor.config.ts (appId), strings.xml
 *     (package_name, custom_url_scheme) and scripts/android/env.ps1 ($AppId) must say the same
 *     (mobile/test/android-app-id.test.ts checks it).
 *   - namespace: `appNamespace` below, "com.mydiary.app" - deliberately NOT the applicationId. It is
 *     only the Java package of the code (MainActivity, com.mydiary.app.plugins), of the generated R and
 *     BuildConfig classes and of relative class names in the manifest (".MainActivity" =
 *     com.mydiary.app.MainActivity). Android allows namespace != applicationId; keeping it means no
 *     Java file moves. Nothing the user or Play sees comes from it. The Windows app keeps its own
 *     identifier com.mydiary.app (src-tauri) - unrelated to this one.
 *   - versionName comes from ../../package.json ("version"), so the phone and the desktop show one
 *     version number.
 *   - versionCode comes from version.properties next to this file; bump it with
 *     `node scripts/android/bump-version.mjs` before every Play upload (Play rejects a reused code).
 *
 * Release signing: read from an EXTERNAL properties file (storeFile, storePassword, keyAlias,
 * keyPassword) - C:\Users\AVI\Projects\android-signing\keystore.properties, or the file named by
 * the environment variable DIARY_ANDROID_SIGNING. No script creates a keystore and nothing secret
 * lives in the repository; without the file the release build is produced UNSIGNED.
 *
 * capacitor.build.gradle (plugins, compile options) is generated by `npx cap sync android`.
 */
import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The application id (Play / phone identity, permanent after the first Play upload).
def appId = 'app.yourpersonaldiary'
// The Java namespace of the code (R, BuildConfig, ".MainActivity"); stays com.mydiary.app - see above.
def appNamespace = 'com.mydiary.app'

def packageJson = new JsonSlurper().parse(rootProject.file('../package.json'))
def appVersionName = packageJson.version as String

def versionProperties = new Properties()
file('version.properties').withInputStream { versionProperties.load(it) }
def appVersionCode = Integer.parseInt(versionProperties.getProperty('versionCode', '1').trim())

def signingEnv = System.getenv('DIARY_ANDROID_SIGNING')
def signingPropertiesFile = signingEnv ? new File(signingEnv) : new File('C:/Users/AVI/Projects/android-signing/keystore.properties')
def signingProperties = new Properties()
def releaseSigningAvailable = signingPropertiesFile.isFile()
if (releaseSigningAvailable) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!signingProperties.getProperty(key)) {
            throw new GradleException("${signingPropertiesFile}: missing '${key}' (expected storeFile, storePassword, keyAlias, keyPassword)")
        }
    }
    logger.lifecycle("Release signing: using ${signingPropertiesFile}")
} else {
    logger.lifecycle("Release signing: ${signingPropertiesFile} not found - release builds are UNSIGNED")
}

android {
    namespace = appNamespace
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps
        // (Capacitor's default; the web assets of mobile-dist/ contain no dot-files anyway).
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                def storePath = new File(signingProperties.getProperty('storeFile'))
                storeFile(storePath.isAbsolute() ? storePath : new File(signingPropertiesFile.parentFile, storePath.path))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // Debuggable (adb, chrome://inspect); Capacitor turns WebView debugging on for debuggable builds only.
            minifyEnabled false
        }
        release {
            // R8 with the rules of proguard-rules.pro (Capacitor and plugin classes are kept) and resource shrinking.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    bundle {
        // The 20 UI languages live in the web bundle, not in Android resources; keep the few Android
        // resource translations (AppCompat) in one bundle instead of Play language splits.
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        // No native libraries of our own are packaged (nothing to align for the 16 KB page size).
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
