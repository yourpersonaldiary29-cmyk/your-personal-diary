// Shared versions of the Android project (Capacitor 8.5.2 template values; read by every module).
// minSdk 24 (Android 7.0), compileSdk / targetSdk 36 (Google Play requires API 36 for new apps);
// buildToolsVersion is the revision installed in the SDK (scripts/android/env.ps1 agrees).
ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    buildToolsVersion = '36.1.0'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}
