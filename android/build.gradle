// Top-level build file of the Android project (Capacitor 8 template, adapted for Your Personal Diary).
// Android Gradle Plugin 8.13.0 comes from Google Maven; the google-services (Firebase) plugin of the
// template is not used by this app and was removed.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Every library module (Capacitor, the npm plugins, the Cordova shim) builds with the build-tools
// revision installed in the SDK (variables.gradle) instead of the plugin's default revision: with
// android.builder.sdkDownload=false (gradle.properties) the build never downloads SDK components;
// they are installed with the SDK tool (scripts/android/doctor.ps1 lists them).
subprojects {
    plugins.withId('com.android.library') {
        project.android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
